# Render Blueprint for the PointerPath website (the code in website/).
# Creates one web service and one Postgres database. Values marked `sync: false`
# are secrets or settings Render asks for when the Blueprint is first applied.
# See website/README.md, "Deploying on Render".

# The resource names below still carry the product's earlier name, PointerTurn. They are left
# alone on purpose: changing a name here makes Render create a new service or database, with
# a new address and an empty database, rather than rename the one that exists.

services:
  - type: web
    name: pointerturn-website
    runtime: node
    region: singapore # the Render region nearest Australia
    plan: starter # the free plan sleeps when idle, which delays Stripe webhooks and licence checks
    rootDir: website
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pointerturn-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENCE_SIGNING_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PLAUSIBLE_SCRIPT_URL
        sync: false
      # The Reddit Ads pixel ID, for conversion tracking. Not a secret; empty switches it off.
      - key: REDDIT_PIXEL_ID
        sync: false
      - key: INSTALLER_URL
        sync: false
      - key: INSTALLER_VERSION
        sync: false
      # The installer is kept in a private Cloudflare R2 bucket. The site signs links to it
      # that work for a few minutes. See "The installer download" in website/README.md.
      - key: R2_ENDPOINT
        value: https://29c9b81a9441e865334e34c386c61e0c.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: pointerpath-installer
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: INSTALLER_FILE
        sync: false
      # The final release price, named beside the lower beta price that Stripe charges.
      - key: PRICE_WAS
        value: "39"
      # Offered in Australia only. See "Restricting to a country" in website/README.md.
      - key: ALLOWED_COUNTRIES
        value: AU
      # Render's traffic comes through Cloudflare, which puts the visitor's own address in
      # this header (and overwrites any a visitor sends). Without it the app sees a
      # Cloudflare address and places every visitor wherever that happens to be.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Two proxies sit in front of the app (Cloudflare, then Render), so the visitor is
      # the second address from the end of X-Forwarded-For. Used for rate limiting.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # "1" logs how each visitor's country was worked out, with their IP address. Off now
      # that the settings above have been checked against a visit from Australia.
      - key: GEO_DEBUG
        value: "0"
      - key: LICENCE_MAX_MACHINES
        value: "2"
      - key: LICENCE_TOKEN_DAYS
        value: "14"

databases:
  - name: pointerturn-db
    region: singapore
    plan: basic-256mb # the free database is deleted after 30 days
    postgresMajorVersion: "16"
